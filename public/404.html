<!doctype html>
<html lang="be">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Старонка не знойдзена | Ales Adamovich</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f2eadb;
        --surface: #f8efdf;
        --text: #1c1712;
        --muted: #5d5043;
        --border: rgba(76, 53, 30, 0.18);
        --accent: #9a6826;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(32px, 6vw, 80px) clamp(20px, 5vw, 72px);
        background:
          radial-gradient(circle at 72% 24%, rgba(154, 104, 38, 0.12), transparent 28rem),
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(80, 54, 28, 0.04)),
          var(--paper);
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(32px, 5vw, 64px);
        border: 1px solid var(--border);
        background: rgba(248, 239, 223, 0.72);
        box-shadow: 0 24px 72px rgba(83, 58, 35, 0.14);
      }

      .code {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .code::after {
        width: 54px;
        height: 1px;
        background: currentcolor;
        content: "";
      }

      h1 {
        max-width: 620px;
        margin: 18px 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.6rem, 8vw, 5.8rem);
        font-weight: 600;
        line-height: 0.98;
      }

      p {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 34px;
        border: 1px solid var(--accent);
        padding: 0 22px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        text-decoration: none;
        text-transform: uppercase;
      }

      a:hover,
      a:focus-visible {
        background: var(--accent);
        color: var(--surface);
      }

      @media (max-width: 640px) {
        main {
          padding: 28px 22px;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="code">404</span>
      <h1>Старонка не знойдзена</h1>
      <p>
        Магчыма, адрас змяніўся або быў набраны з памылкай. Вярніцеся на
        галоўную старонку і працягніце шлях па сайце.
      </p>
      <a href="/be/">На галоўную</a>
    </main>
  </body>
</html>
